name: Build Windows x64 Portable Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish V2SubAuto (win-x64 self-contained)
        run: |
          dotnet publish src/V2SubAuto/V2SubAuto.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -o publish/V2SubAuto

      - name: Download latest Xray-core and sing-box binaries
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "V2SubAuto-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }

          # 1. Xray-core
          New-Item -ItemType Directory -Force -Path "publish/V2SubAuto/bin/xray" | Out-Null
          $xrayRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases/latest" -Headers $headers
          $xrayAsset = $xrayRelease.assets | Where-Object { $_.name -eq "Xray-windows-64.zip" } | Select-Object -First 1
          if ($xrayAsset) {
            Invoke-WebRequest -Uri $xrayAsset.browser_download_url -OutFile "xray.zip"
            Expand-Archive -Path "xray.zip" -DestinationPath "xray_tmp" -Force
            Copy-Item "xray_tmp/xray.exe" "publish/V2SubAuto/bin/xray/xray.exe" -Force
            Remove-Item "xray.zip", "xray_tmp" -Recurse -Force
          }

          # 2. sing-box
          New-Item -ItemType Directory -Force -Path "publish/V2SubAuto/bin/sing_box" | Out-Null
          $sbRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers $headers
          $sbAsset = $sbRelease.assets | Where-Object {
            $_.name -like "*-windows-amd64.zip" -and $_.name -notlike "*legacy*" -and $_.name -notlike "*fips*"
          } | Select-Object -First 1
          if ($sbAsset) {
            Invoke-WebRequest -Uri $sbAsset.browser_download_url -OutFile "singbox.zip"
            Expand-Archive -Path "singbox.zip" -DestinationPath "sb_tmp" -Force
            $sbExe = Get-ChildItem -Path "sb_tmp" -Filter "sing-box.exe" -Recurse | Select-Object -First 1
            if ($sbExe) {
              Copy-Item $sbExe.FullName "publish/V2SubAuto/bin/sing_box/sing-box.exe" -Force
            }
            Remove-Item "singbox.zip", "sb_tmp" -Recurse -Force
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/V2SubAuto/*" -DestinationPath "V2SubAuto-win-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: V2SubAuto-win-x64.zip
          archive: false
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: V2SubAuto-win-x64.zip
